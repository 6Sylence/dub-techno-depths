name: Generate car backgrounds

# Manual: generate a library of copyright-safe generic-car background images with
# an AI image API and commit them to assets/car_backgrounds/. Once the folder has
# images, the daily video uses them (rotated) as the static base instead of the
# drawn synthwave scene. Needs an OPENAI_API_KEY repo secret. One-time cost.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many images to generate"
        required: false
        default: "12"
      size:
        description: "Image size (dall-e-3: 1792x1024 / 1024x1792 / 1024x1024)"
        required: false
        default: "1792x1024"
      refresh:
        description: "Delete existing images first (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Optionally clear the library
        if: ${{ github.event.inputs.refresh == 'true' }}
        run: rm -f assets/car_backgrounds/*.jpg assets/car_backgrounds/*.jpeg assets/car_backgrounds/*.png

      - name: Generate backgrounds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BG_COUNT: ${{ github.event.inputs.count }}
          IMAGE_SIZE: ${{ github.event.inputs.size }}
        run: python scripts/generate_backgrounds.py

      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/car_backgrounds/*.jpg assets/car_backgrounds/*.jpeg assets/car_backgrounds/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new images to commit"
          else
            git commit -m "Add AI-generated car background images"
            git push
          fi
