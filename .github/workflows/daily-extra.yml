name: Daily Aura Phonk upload

# The SECOND daily upload: an AURA-PHONK mix (ROTATION=aura), a different lane
# from the car-music morning slot, both rendered with ElevenLabs Music. SLOT=1
# shifts the rotation and salts the seed so it never clones the morning video.
#
# 01:07 UTC targets the US night window (21:07 EDT / 18:07 PDT) — prime time for
# dreamy night-drive/aura content — while the car-music upload lands the US+EU
# daytime peak at 17:07 UTC. Minute :07 avoids GitHub's congested top-of-hour.
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "Force a preset id (blank = rotate by date, slot 1)"
        required: false
        default: ""
      no_upload:
        description: "Render only, do not upload (true/false)"
        required: false
        default: "false"
      privacy:
        description: "public / unlisted / private (blank = default)"
        required: false
        default: ""

concurrency:
  group: daily-upload-extra
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Use ElevenLabs like the morning slot so published mixes are never the
          # old procedural engine. The pipeline aborts (does not upload) if the
          # AI music is unavailable, so a bad mix can never go live.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Cool AI cover per video (Cloudflare Workers AI, free tier). Falls back
          # to the procedural thumbnail if these secrets aren't set.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MUSIC_ENGINE: ${{ vars.MUSIC_ENGINE || 'ai' }}
          AI_TRACKS: ${{ github.event.inputs.ai_tracks || vars.AI_TRACKS || '1' }}
          AI_TRACK_SECONDS: ${{ github.event.inputs.ai_track_seconds || vars.AI_TRACK_SECONDS_AURA || '45' }}
          # This slot is the AURA-phonk video (trending): a different category
          # from the car-music morning slot, so the channel runs two lanes.
          ROTATION: aura
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '300' }}
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS_AURA || '3600' }}
          DEFAULT_PRIVACY: ${{ github.event.inputs.privacy || vars.DEFAULT_PRIVACY || 'public' }}
          SLOT: "1"
          AFFILIATE_BLOCK: ${{ vars.AFFILIATE_BLOCK || '' }}
          PRESET: ${{ github.event.inputs.preset }}
          NO_UPLOAD: ${{ github.event.inputs.no_upload }}
        run: python -m src.pipeline

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: render-extra-${{ github.run_id }}
          path: |
            out/metadata.json
            out/result.json
            out/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 2
