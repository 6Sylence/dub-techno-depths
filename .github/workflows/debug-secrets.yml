name: Debug secrets presence

# TEMPORARY diagnostic: prints true/false for whether each Actions secret is set
# (never the value). CF_ACCOUNT_ID already resolves; this probes common NAME
# variants for the token to find which one you actually saved. Safe to delete.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secret names does Actions see?
        run: |
          echo "ELEVENLABS_API_KEY   : ${{ secrets.ELEVENLABS_API_KEY != '' }}  (control)"
          echo "CF_ACCOUNT_ID        : ${{ secrets.CF_ACCOUNT_ID != '' }}"
          echo "--- token name variants ---"
          echo "CF_API_TOKEN         : ${{ secrets.CF_API_TOKEN != '' }}   <-- the one we use"
          echo "CLOUDFLARE_API_TOKEN : ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "CF_TOKEN             : ${{ secrets.CF_TOKEN != '' }}"
          echo "CF_API_KEY           : ${{ secrets.CF_API_KEY != '' }}"
          echo "CF_APITOKEN          : ${{ secrets.CF_APITOKEN != '' }}"
          echo "CF_WORKERS_AI_TOKEN  : ${{ secrets.CF_WORKERS_AI_TOKEN != '' }}"
          echo "CLOUDFLARE_TOKEN     : ${{ secrets.CLOUDFLARE_TOKEN != '' }}"
