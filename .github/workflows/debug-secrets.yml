name: Debug secrets presence

# TEMPORARY diagnostic: prints true/false for whether each Actions secret is set
# (never the value). ELEVENLABS_API_KEY is the control — we know it works, so if
# it shows true while the CF ones show false, the CF secrets aren't stored as
# repository *Actions* secrets. Safe to delete once the covers work.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets does Actions see?
        run: |
          echo "ELEVENLABS_API_KEY present: ${{ secrets.ELEVENLABS_API_KEY != '' }}   (control — should be true)"
          echo "CF_ACCOUNT_ID       present: ${{ secrets.CF_ACCOUNT_ID != '' }}"
          echo "CF_API_TOKEN        present: ${{ secrets.CF_API_TOKEN != '' }}"
          echo "VOICE_NAME (var)    present: ${{ vars.VOICE_NAME != '' }}"
