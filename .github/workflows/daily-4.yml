name: Daily Aura Phonk upload 4

# Fourth daily long: an AURA-PHONK mix (ROTATION=aura), SLOT=3 so the preset
# rotation and seed differ from the other slots (never a clone). 13:07 UTC hits
# the US morning / EU afternoon window. Part of the high-volume aura schedule
# (4 longs + 2 shorts/day); AI-music seconds are sized to the ElevenLabs plan.
on:
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "Force a preset id (blank = rotate by date, slot 3)"
        required: false
        default: ""
      no_upload:
        description: "Render only, do not upload (true/false)"
        required: false
        default: "false"
      privacy:
        description: "public / unlisted / private (blank = default)"
        required: false
        default: ""

concurrency:
  group: daily-upload-4
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # ElevenLabs AI music; pipeline aborts rather than publish the old
          # procedural engine, so a bad mix can never go live.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUSIC_ENGINE: ${{ vars.MUSIC_ENGINE || 'ai' }}
          ROTATION: aura
          AI_TRACKS: ${{ github.event.inputs.ai_tracks || vars.AI_TRACKS || '1' }}
          AI_TRACK_SECONDS: ${{ github.event.inputs.ai_track_seconds || vars.AI_TRACK_SECONDS_AURA || '45' }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '300' }}
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS_AURA || '3600' }}
          DEFAULT_PRIVACY: ${{ github.event.inputs.privacy || vars.DEFAULT_PRIVACY || 'public' }}
          SLOT: "3"
          AFFILIATE_BLOCK: ${{ vars.AFFILIATE_BLOCK || '' }}
          PRESET: ${{ github.event.inputs.preset }}
          NO_UPLOAD: ${{ github.event.inputs.no_upload }}
        run: python -m src.pipeline

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: render-4-${{ github.run_id }}
          path: |
            out/metadata.json
            out/result.json
            out/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 2
