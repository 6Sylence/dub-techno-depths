name: Daily Short

# One vertical Short per day at 23:07 UTC ≈ 19:07 US Eastern / 16:07 Pacific —
# the US evening scroll window, when Shorts get the most swipes. Shorts are the
# main discovery engine for a young channel (they're shown to non-subscribers),
# so this is the funnel that feeds the long mixes. SLOT=1 teases that day's
# bass-boosted bounce drop.
#
# API budget: a video insert costs 1600 units of the project's 10,000/day quota.
# With the two long uploads (17:07 + 01:07) this Short brings the day to
# 3 x 1600 = 4800, comfortably under 10k. If a run ever fails with
# "quotaExceeded", give this channel its own Google Cloud project (README
# "Puesta en marcha") to restore a full 10k quota.
on:
  schedule:
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "Force a preset id (blank = slot rotation)"
        required: false
        default: ""
      no_upload:
        description: "Render only, do not upload (true/false)"
        required: false
        default: "false"

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render and upload Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # The Short uses a real ElevenLabs AI drop (best 60 s of a peak-energy
          # track), falling back to the procedural engine only if credits run low.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUSIC_ENGINE: ${{ vars.MUSIC_ENGINE || 'ai' }}
          VERTICAL: "1"
          LOOP_SECONDS: "60"
          TARGET_SECONDS: "60"
          SLOT: "1"
          DEFAULT_PRIVACY: ${{ vars.DEFAULT_PRIVACY || 'public' }}
          PRESET: ${{ github.event.inputs.preset }}
          NO_UPLOAD: ${{ github.event.inputs.no_upload }}
        run: python -m src.pipeline

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: short-${{ github.run_id }}
          path: |
            out/metadata.json
            out/result.json
          if-no-files-found: ignore
          retention-days: 2
