name: Daily EDM upload

# One upload a day (cron is UTC) at a peak listening window.
#
# AI-music budget (ElevenLabs Creator): 100,000 credits/month and Eleven Music
# costs 900 credits/min -> ~111 min of generated music per month. So we generate
# ~3.5 min of fresh music per day (1 track x 210 s = 105 min/month, ~5% buffer)
# and tile it to a 20-min video. Bump AI_TRACK_SECONDS / add a second cron only
# on a bigger ElevenLabs plan (Pro = 500k credits ≈ 555 min/month).
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "Force a preset id (blank = rotate by date)"
        required: false
        default: ""
      no_upload:
        description: "Render only, do not upload (true/false)"
        required: false
        default: "false"
      privacy:
        description: "public / unlisted / private (blank = default)"
        required: false
        default: ""
      ai_tracks:
        description: "AI tracks to generate this run (blank = default)"
        required: false
        default: ""
      ai_track_seconds:
        description: "Seconds per AI track (blank = default)"
        required: false
        default: ""

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # AI music (ElevenLabs Music). Falls back to the procedural engine if
          # the key is missing or the API errors, so the upload never breaks.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUSIC_ENGINE: ${{ vars.MUSIC_ENGINE || 'ai' }}
          AI_TRACKS: ${{ github.event.inputs.ai_tracks || vars.AI_TRACKS || '1' }}
          AI_TRACK_SECONDS: ${{ github.event.inputs.ai_track_seconds || vars.AI_TRACK_SECONDS || '210' }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '300' }}
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS || '1200' }}
          DEFAULT_PRIVACY: ${{ github.event.inputs.privacy || vars.DEFAULT_PRIVACY || 'public' }}
          SLOT: "0"
          AFFILIATE_BLOCK: ${{ vars.AFFILIATE_BLOCK || '' }}
          PRESET: ${{ github.event.inputs.preset }}
          NO_UPLOAD: ${{ github.event.inputs.no_upload }}
        run: python -m src.pipeline

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: render-${{ github.run_id }}
          path: |
            out/metadata.json
            out/result.json
            out/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 2
