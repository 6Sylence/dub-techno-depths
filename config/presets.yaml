# Subgenre presets for Dub Techno Depths.
#
# audio.* parameters drive src/audio.py (the dub techno engine); visual.* is
# consumed by src/video.py (parallax gradient + mist + particles). One preset
# rotates in per day, and the daily seed also varies key/patterns, so no two
# uploads ever sound the same.

presets:
  - id: dub_classic
    title: "Dub Techno"
    theme_words: ["Deep Focus", "Coding", "Late Night Work", "Hypnosis"]
    emoji: "🌀"
    audio:
      bpm: 122
      chord: m7
      bright: 2400
      delay_fb: 0.55
      hat_gain: 0.5
      pad_gain: 0.25
      crackle_gain: 0.6
    visual:
      palette: ["#050a0c", "#0a1a1e", "#123236", "#1d5359"]
      grain: 0.06
      vignette: 0.62
      scroll_seconds: 300

  - id: deep_space
    title: "Deep Space Techno"
    theme_words: ["Deep Work", "Night Drive", "Immersion", "Flow State"]
