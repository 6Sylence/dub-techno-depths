# Lofi hip hop presets. One rotates in per day; the daily seed also varies the
# key feel and drum humanization so no two uploads are identical.
#
# audio.progression: 4 bars of [root_midi, chord_quality] (jazzy voicings).
# visual.*: consumed by src/video.py (cozy warm gradient + mist + effect).

presets:
  - id: lofi_study
    title: "Lofi Hip Hop"
    theme_words: ["Study", "Relax", "Focus", "Chill"]
    emoji: "📚"
    audio:
      bpm: 78
      progression: [[50, min9], [55, dom9], [48, maj9], [57, min7]]
      swing: 0.36
      warble: 0.004
      master_cut: 8000
      crackle_gain: 0.7
      reverb: 0.22
    visual:
      palette: ["#1a120b", "#33231a", "#5a3a24", "#8a5a34"]
      effect: embers
      effect_density: 0.5
      mist_opacity: 70
      grain: 0.08
      vignette: 0.62
      scroll_seconds: 320

