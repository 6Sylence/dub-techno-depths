# Deep / dub / melodic / driving techno presets. One rotates in per day; the
# daily seed also varies drum humanization, stab velocities and the arpeggio so
# no two uploads are identical.
#
# audio.progression: [root_midi, chord_quality] per bar (minor-leaning voicings).
# audio.style: dub | melodic | driving  -> selects voicing/arrangement flavour.
# visual.*: consumed by src/video.py (dark club gradient + mist + effect).

presets:
  # ---------------- DUB / DEEP ----------------
  - id: deep_dub
    title: "Deep Techno"
    theme_words: ["Focus", "Deep Work", "Night", "Concentration"]
    emoji: "🌌"
    audio:
      bpm: 122
      style: dub
      progression: [[45, min9], [45, min9], [50, min7], [43, minadd9]]
      kick_deep: 0.8
      kick_punch: 0.7
      bass_mode: roll
      stab_cut: 2200
      resonance: 0.6
      pad_cut: 1200
      filter_base: 800
      filter_depth: 1400
      delay_div: 0.75
      delay_feedback: 0.45
      sidechain: 0.6
      master_cut: 12000
      master_sweep_base: 4200
      master_sweep_depth: 3200
    visual:
      palette: ["#04070d", "#0a1420", "#123048", "#1d5878"]
      effect: stars
      effect_density: 1.1
      mist_opacity: 60
      grain: 0.05
      vignette: 0.72
      scroll_seconds: 340

  - id: dub_chords
