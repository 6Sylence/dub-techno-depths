# Bass-boosted EDM / Melbourne-bounce / electro-house presets. One rotates in
# per day; the daily seed varies drum humanization, the lead riff and the drop
# so no two uploads are identical.
#
# audio.progression: [root_midi, chord_quality] per bar (catchy voicings).
# audio.style: bounce | bigroom | electro -> selects the low-end/lead flavour.
# visual.*: consumed by src/video.py (neon synthwave gradient + glow + beat pulse).

# Rotation order (indexed by date/slot). Car / driving is the best-performing
# theme, so it's weighted to ~75% of uploads; the rest keep the channel varied.
# Edit this list to change how often each preset appears.
rotation:
  - car_bounce
  - bass_drive
  - bounce_night
  - big_room
  - night_highway
  - car_bounce
  - turbo_drive
  - festival
  - bass_drive
  - bounce_night
  - electro_house
  - night_highway

# Rotation for the AURA-phonk daily slots (ROTATION=aura). Only aura presets.
# 8 distinct sub-styles so the many daily uploads never look/sound alike — key
# to staying clear of YouTube's "repetitious content" filter at high volume.
rotation_aura:
  - aura_midnight
  - aura_brazilian
  - aura_dream
  - aura_gym
  - aura_ethereal
  - aura_night
  - aura_rage
  - aura_sigma

# Rotation for the TRAP-MAFIA slots (ROTATION=mafia): Spanish bass-boosted trap
# with the channel owner's cloned voice mixed on top (genre: trap_mafia).
rotation_mafia:
  - mafia_trap
  - trap_boosted

presets:
  # ---------------- BOUNCE ----------------
  - id: bounce_night
    title: "Bounce"
    theme_words: ["Night Drive", "Car Music", "Workout", "Party"]
    emoji: "🔊"
    audio:
      bpm: 126
      style: bounce
      progression: [[45, min], [52, maj], [48, min7], [50, sus2]]
      donk_gain: 1.05
      donk_drive: 2.0
      sub_gain: 0.7
      chord_gain: 0.8
      lead_gain: 0.7
      bass_boost: 0.45
      loudness: 1.28
      sidechain: 0.82
      vocal_gain: 0.6
      vowel: "ah"
      master_cut: 17000
    visual:
      style: synthwave
      palette: ["#150a2e", "#3a0d55", "#ff2d95", "#ff2bd0"]
      effect: stars
